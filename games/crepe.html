<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>クレープやさん</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,#ffd9e8,#fff1dc);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#5b3a29;-webkit-user-select:none;user-select:none}
#app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:14px}
.chip{background:#fff;border-radius:14px;padding:6px 12px;box-shadow:0 2px 0 rgba(120,60,40,.12)}
#order{background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 3px 0 rgba(120,60,40,.14);position:relative}
#oRow{display:flex;align-items:center;gap:10px}
#cust{font-size:44px;line-height:1}
#oMid{flex:1;min-width:0}
#oMid small{font-size:11px;opacity:.7;font-weight:700}
#oTops{font-size:30px;line-height:1.2;letter-spacing:4px}
#pat{height:8px;border-radius:4px;background:#f3e2d6;margin-top:6px;overflow:hidden}
#pat i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7a7a,#ffc14a,#7ad67a);background-size:300% 100%;transition:none}
#msg{text-align:center;font-weight:900;font-size:17px;min-height:26px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{touch-action:none;border-radius:50%;background:transparent}
#meterBox{height:22px;position:relative}
#meter{position:absolute;left:4px;right:4px;top:4px;height:14px;border-radius:7px;background:#fff;box-shadow:inset 0 1px 3px rgba(0,0,0,.18);overflow:hidden}
#mfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd3a1,#ff9ac0)}
#mzone{position:absolute;top:0;bottom:0;left:60%;width:20%;background:rgba(80,200,110,.55);display:none}
#mk{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2px;background:#5b3a29;border-radius:3px;display:none;left:0}
#tools{min-height:72px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.tb{border:0;border-radius:16px;background:#fff;padding:6px 4px;min-width:64px;font-size:11px;font-weight:800;color:#5b3a29;box-shadow:0 3px 0 rgba(120,60,40,.18);line-height:1.2}
.tb b{display:block;font-size:30px;line-height:1.1;font-weight:400}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,60,40,.18)}
.big{border:0;border-radius:18px;padding:16px 28px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ff7aa8,#ff9d5c);box-shadow:0 5px 0 #c8506f}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c8506f}
.big.sub{background:#fff;color:#5b3a29;box-shadow:0 4px 0 rgba(120,60,40,.2);font-size:15px;padding:12px 16px}
.ov{position:fixed;inset:0;background:rgba(255,235,245,.88);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.ov.hide{display:none}
.card{background:#fff;border-radius:26px;padding:22px 20px;max-width:380px;width:100%;text-align:center;box-shadow:0 8px 0 rgba(120,60,40,.16)}
.card h1{margin:0 0 4px;font-size:34px;color:#e0507f}
.card p{margin:8px 0 14px;font-size:14px;line-height:1.7}
.face{font-size:64px;line-height:1.1}
.stars{font-size:34px;letter-spacing:4px;margin:4px 0}
.pts{font-size:36px;font-weight:900;color:#e0507f}
.hint{font-size:13px;opacity:.85;min-height:20px;margin:6px 0 12px}
@media (min-width:700px){#app{max-width:760px}.hud{font-size:17px}#msg{font-size:22px}#cust{font-size:56px}#oTops{font-size:38px}.tb{min-width:84px;font-size:13px}.tb b{font-size:40px}.card{max-width:460px}}
</style>
</head>
<body>
<div id="app">
  <div class="hud"><span class="chip" id="hN">お客さん 1/5</span><span class="chip" id="hS">0 点</span><span class="chip" id="hC">コンボ 0</span><button class="chip" id="bSnd" style="border:0;font-size:16px">🔊</button></div>
  <div id="order">
    <div id="oRow"><div id="cust">🐱</div><div id="oMid"><small>ご注文</small><div id="oTops"></div></div></div>
    <div id="pat"><i id="patI"></i></div>
  </div>
  <div id="msg"></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="meterBox"><div id="meter"><div id="mfill"></div><div id="mzone"></div><div id="mk"></div></div></div>
  <div id="tools"></div>
</div>

<div class="ov" id="menu"><div class="card">
  <div class="face">🥞</div>
  <h1>クレープやさん</h1>
  <p>お客さんの注文どおりに、クレープを作ろう！<br>① 生地をぐるぐる広げる<br>② ちょうどいい焼き色で取り出す<br>③ 注文のトッピングをのせる<br>④ スワイプして巻く</p>
  <div class="hint" id="bestT"></div>
  <button class="big" id="bStart">はじめる</button>
</div></div>

<div class="ov hide" id="res"><div class="card">
  <div class="face" id="rFace">😍</div>
  <div class="stars" id="rStars">★★★</div>
  <div class="pts" id="rPts">+100</div>
  <div class="hint" id="rHint"></div>
  <button class="big" id="bNext">つぎのお客さん</button>
</div></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
cv.width=cv.height=720;ctx.scale(2,2);
const bat=document.createElement('canvas');bat.width=bat.height=360;const bx=bat.getContext('2d');
const C=180,TOTAL=5;
const TOP=[{k:'st',e:'🍓',n:'いちご'},{k:'ba',e:'🍌',n:'バナナ'},{k:'ch',e:'🍫',n:'チョコ'},{k:'cr',e:'🍦',n:'クリーム'},{k:'ho',e:'🍯',n:'はちみつ'},{k:'nu',e:'🌰',n:'ナッツ'},{k:'ki',e:'🥝',n:'キウイ'}];
const TE={};TOP.forEach(t=>TE[t.k]=t.e);
const CUST=['🐱','🐶','🐰','🐻','🐼','🦊','🐸','🐷'];
function pref(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
let best=parseInt(pref('crepe_best')||'0',10)||0;

// ---------- audio ----------
let AC=null,muted=false,siz=null;
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function blip(f,d,type,vol){
  if(muted||!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||0.12;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.stop(AC.currentTime+d+0.02);}catch(e){}
}
function sizzle(on){
  if(!AC)return;
  try{
    if(on&&!siz&&!muted){
      const len=AC.sampleRate*1,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
      const s=AC.createBufferSource();s.buffer=buf;s.loop=true;
      const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=3500;f.Q.value=0.6;
      const g=AC.createGain();g.gain.value=0.05;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();siz={s,g};
    }else if(!on&&siz){siz.s.stop();siz=null;}
  }catch(e){}
}
function chime(n){[523,659,784,1047].slice(0,n+1).forEach((f,i)=>setTimeout(()=>blip(f,0.25,'triangle',0.13),i*90));}

// ---------- state ----------
let state='menu',G={i:0,score:0,combo:0},order=null,patience=1,patDur=50;
let cells=new Uint8Array(900),cnt=0,totalCells=0,cover=0,drawing=false,lastP=null,tool=null;
let d=0,bakeScore=0,placed=[],rp=0,rollX0=0,fin=false,bakeD=0;
const ph1=Math.random()*6,ph2=Math.random()*6;
const spots=[];for(let i=0;i<80;i++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*125;spots.push({x:Math.cos(a)*r,y:Math.sin(a)*r,s:3+Math.random()*7});}
(function(){for(let j=0;j<30;j++)for(let i=0;i<30;i++){if(Math.hypot(i*12+6-C,j*12+6-C)<128)totalCells++;}})();

function radius(a){return 132+3*Math.sin(3*a+ph1)+2*Math.sin(5*a+ph2);}
function crepePath(c,cx,cy){c.beginPath();for(let k=0;k<=72;k++){const a=k/72*6.2832,r=radius(a);const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(k)c.lineTo(x,y);else c.moveTo(x,y);}c.closePath();}
function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
const STOPS=[[0,'#f7e6bd'],[0.35,'#f0cf86'],[0.7,'#dca24a'],[1.0,'#8a4a17'],[1.2,'#2a1a10']];
function crepeColor(v){
  v=Math.max(0,Math.min(1.2,v));
  for(let i=1;i<STOPS.length;i++){if(v<=STOPS[i][0]){const a=STOPS[i-1],b=STOPS[i],t=(v-a[0])/(b[0]-a[0]),A=hex(a[1]),B=hex(b[1]);return 'rgb('+A.map((x,k)=>Math.round(x+(B[k]-x)*t)).join(',')+')';}}
  return '#2a1a10';
}

// ---------- UI helpers ----------
function msg(t){$('msg').textContent=t;}
function setTools(h){$('tools').innerHTML=h;}
function meterMode(m){
  $('mfill').style.display=m==='fill'?'block':'none';
  $('mzone').style.display=m==='bake'?'block':'none';
  $('mk').style.display=m==='bake'?'block':'none';
  $('meterBox').style.visibility=m?'visible':'hidden';
}
function updHud(){$('hN').textContent='お客さん '+Math.min(G.i+1,TOTAL)+'/'+TOTAL;$('hS').textContent=G.score+' 点';$('hC').textContent='コンボ '+G.combo;}
function fit(){const w=$('stage');const s=Math.floor(Math.min(w.clientWidth,w.clientHeight));cv.style.width=cv.style.height=Math.max(120,s)+'px';}
window.addEventListener('resize',fit);

// ---------- flow ----------
function newGame(){
  G={i:0,score:0,combo:0};
  startOrder();
}
function startOrder(){
  const n=[1,2,2,3,3][G.i],pool=TOP.map(t=>t.k);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  order={cust:CUST[Math.floor(Math.random()*CUST.length)],tops:pool.slice(0,n)};
  patDur=[60,55,52,50,48][G.i];patience=1;
  $('cust').textContent=order.cust;
  $('oTops').textContent=order.tops.map(k=>TE[k]).join(' ');
  updHud();fit();startSpread();
}
function startSpread(){
  state='spread';bx.clearRect(0,0,360,360);cells.fill(0);cnt=0;cover=0;drawing=false;lastP=null;fin=false;rp=0;placed=[];d=0;
  paint(C,C);
  msg('① 生地を指でぐるぐる広げよう！');
  meterMode('fill');$('mfill').style.width='0%';setTools('');
}
function startBake(){
  state='bake';d=0;tool=null;
  msg('② 黄金色になったら取り出そう！');
  meterMode('bake');
  setTools('<button class="big" id="bOut">取り出す！</button>');
  sizzle(true);
}
function takeOut(){
  if(state!=='bake')return;
  sizzle(false);bakeD=d;
  bakeScore=d>=1?0.1:1-Math.min(1,Math.max(0,Math.abs(d-0.7)-0.08)/0.3);
  blip(700,0.12,'triangle');
  startTop();
}
function startTop(){
  state='top';placed=[];meterMode(null);
  msg('③ 注文のトッピングをのせよう！');
  buildTopTools();
}
function buildTopTools(){
  setTools(TOP.map(t=>'<button class="tb" data-k="'+t.k+'"><b>'+t.e+'</b>'+t.n+'</button>').join('')+
    '<button class="tb" id="bClr"><b>↩️</b>やりなおし</button><button class="big" id="bRoll" style="padding:12px 20px;font-size:18px">巻く ▶</button>');
}
function addTop(k){
  if(state!=='top')return;
  let x=C,y=C,ok=false;
  for(let t=0;t<30&&!ok;t++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*88;x=C+Math.cos(a)*r;y=C+Math.sin(a)*r;ok=placed.every(p=>Math.hypot(p.x-x,p.y-y)>34);}
  placed.push({k,x,y});blip(500+Math.random()*400,0.08,'triangle',0.1);
}
function startRoll(){
  if(state!=='top')return;
  state='roll';rp=0;drawing=false;fin=false;
  msg('④ 左から右へスワイプして巻こう！');setTools('');
}
function finishRoll(){
  state='serve';fin=true;chime(2);
  // scores
  const need=order.tops,cnts={};placed.forEach(p=>cnts[p.k]=(cnts[p.k]||0)+1);
  let miss=0,extra=0;
  need.forEach(k=>{const c=cnts[k]||0;if(c===0)miss++;else if(c>1)extra+=c-1;});
  Object.keys(cnts).forEach(k=>{if(!need.includes(k))extra+=cnts[k];});
  const top=Math.max(0,1-miss*0.34-extra*0.2);
  const tot=0.3*bakeScore+0.5*top+0.2*Math.max(0,patience);
  const base=Math.round(tot*100),stars=base>=85?3:base>=60?2:base>=35?1:0;
  const pts=Math.round(base*(1+0.1*Math.min(G.combo,5)));
  G.combo=stars===3?G.combo+1:0;G.score+=pts;updHud();
  let hint='';
  if(miss)hint='注文のトッピングが足りなかったよ';
  else if(extra)hint='余計なトッピングがのっていたよ';
  else if(bakeScore<0.55)hint=bakeD<0.6?'ちょっと生焼けだったよ':'焦げちゃったよ';
  else if(patience<0.3)hint='ちょっと待ったよ…';
  else hint=stars===3?'ぴったり！ありがとう！':'もうちょっと！';
  setTimeout(()=>showRes(['😣','😐','😊','😍'][stars],stars,pts,hint),700);
}
function customerLeft(){
  sizzle(false);state='serve';G.combo=0;updHud();blip(180,0.4,'sawtooth',0.1);
  showRes('😡',0,0,'待たせすぎて帰っちゃった…');
}
function showRes(face,stars,pts,hint){
  $('rFace').textContent=order.cust+face;
  $('rStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('rPts').textContent=pts?('+'+pts):'0';
  $('rHint').textContent=hint;
  $('bNext').textContent=G.i>=TOTAL-1?'けっかを見る':'つぎのお客さん';
  state='result';$('res').classList.remove('hide');
}
function next(){
  $('res').classList.add('hide');
  G.i++;
  if(G.i>=TOTAL){showFinal();return;}
  startOrder();
}
function showFinal(){
  state='menu';
  const s=G.score,rank=s>=520?'👑 伝説のクレープ職人':s>=400?'🏆 人気店の店長':s>=250?'🥇 一人前の職人':s>=100?'🥈 見習い職人':'🥉 はじめの一歩';
  let nb=false;if(s>best){best=s;pref('crepe_best',String(best));nb=true;}
  document.querySelector('#menu h1').textContent='おつかれさま！';
  document.querySelector('#menu .face').textContent='🥞';
  document.querySelector('#menu p').innerHTML='<div class="pts">'+s+' 点</div><b>'+rank+'</b>';
  $('bestT').textContent=nb?'🎉 ベスト更新！':'ベスト '+best+' 点';
  $('bStart').textContent='もう一度あそぶ';
  $('menu').classList.remove('hide');
}

// ---------- input ----------
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*360,y:(e.clientY-r.top)/r.height*360};}
function paint(x,y){
  bx.fillStyle='#f7e6bd';bx.beginPath();bx.arc(x,y,26,0,7);bx.fill();
  const i0=Math.max(0,Math.floor((x-26)/12)),i1=Math.min(29,Math.floor((x+26)/12)),j0=Math.max(0,Math.floor((y-26)/12)),j1=Math.min(29,Math.floor((y+26)/12));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const cx=i*12+6,cy=j*12+6;
    if(!cells[j*30+i]&&Math.hypot(cx-x,cy-y)<26&&Math.hypot(cx-C,cy-C)<128){cells[j*30+i]=1;cnt++;}
  }
  cover=cnt/totalCells;
}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  const p=pt(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(state==='spread'){drawing=true;lastP=p;tool=p;paint(p.x,p.y);}
  else if(state==='roll'){drawing=true;rollX0=p.x-rp*220;}
});
cv.addEventListener('pointermove',e=>{
  const p=pt(e);
  if(state==='spread'&&drawing){
    const dx=p.x-lastP.x,dy=p.y-lastP.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));
    for(let k=1;k<=n;k++)paint(lastP.x+dx*k/n,lastP.y+dy*k/n);
    lastP=p;tool=p;
    $('mfill').style.width=Math.min(100,cover/0.9*100)+'%';
    if(cover>=0.9){drawing=false;blip(660,0.12,'triangle');startBake();}
  }else if(state==='roll'&&drawing){
    rp=Math.max(0,Math.min(1,(p.x-rollX0)/220));
    if(rp>=1){drawing=false;finishRoll();}
  }
});
function up(){drawing=false;tool=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('tools').addEventListener('click',e=>{
  ensureAudio();
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='bOut')takeOut();
  else if(b.id==='bClr'){placed=[];blip(300,0.08,'sine');}
  else if(b.id==='bRoll')startRoll();
  else if(b.dataset.k)addTop(b.dataset.k);
});
$('bStart').onclick=()=>{ensureAudio();$('menu').classList.add('hide');newGame();};
$('bNext').onclick=()=>{ensureAudio();next();};
$('bSnd').onclick=()=>{muted=!muted;$('bSnd').textContent=muted?'🔇':'🔊';if(muted)sizzle(false);ensureAudio();};
['gesturestart','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(!e.target.closest('.ov'))e.preventDefault();},{passive:false});

// ---------- drawing ----------
function drawGriddle(){
  const g=ctx.createRadialGradient(C-30,C-30,20,C,C,170);g.addColorStop(0,'#5a5a66');g.addColorStop(1,'#25252c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(C,C,170,0,7);ctx.fill();
  ctx.strokeStyle='#8a8a98';ctx.lineWidth=4;ctx.beginPath();ctx.arc(C,C,166,0,7);ctx.stroke();
}
function drawPlate(){
  ctx.fillStyle='rgba(120,60,40,.18)';ctx.beginPath();ctx.ellipse(C,C+10,168,160,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(C,C,166,0,7);ctx.fill();
  ctx.strokeStyle='#ffc2d8';ctx.lineWidth=8;ctx.beginPath();ctx.arc(C,C,154,0,7);ctx.stroke();
}
function drawCrepeFull(col,dd,sx,sy){
  ctx.save();ctx.translate(C,C);ctx.scale(sx,sy);
  crepePath(ctx,0,0);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(90,50,20,.35)';ctx.stroke();
  ctx.save();crepePath(ctx,0,0);ctx.clip();
  ctx.fillStyle='rgba(120,60,20,'+Math.min(0.4,dd*0.45)+')';
  spots.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,7);ctx.fill();});
  ctx.restore();ctx.restore();
}
function drawTops(sx,sy){
  ctx.save();ctx.translate(C,C);ctx.scale(sx,sy);ctx.translate(-C,-C);
  ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  placed.forEach(p=>ctx.fillText(TE[p.k],p.x,p.y));
  ctx.restore();
}
function drawCone(col){
  ctx.save();
  ctx.fillStyle='rgba(120,60,40,.2)';ctx.beginPath();ctx.ellipse(C,310,70,12,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(C,305);ctx.lineTo(108,118);ctx.quadraticCurveTo(C,84,252,118);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(90,50,20,.4)';ctx.stroke();
  ctx.strokeStyle='rgba(120,70,30,.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(C,305);ctx.quadraticCurveTo(150,200,150,112);ctx.stroke();
  ctx.beginPath();ctx.moveTo(C,305);ctx.quadraticCurveTo(205,210,215,112);ctx.stroke();
  ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const ks=[];placed.forEach(p=>{if(!ks.includes(p.k))ks.push(p.k);});
  ks.slice(0,5).forEach((k,i,a)=>ctx.fillText(TE[k],C+(i-(a.length-1)/2)*38,98-Math.abs(i-(a.length-1)/2)*-6));
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,360,360);
  if(state==='spread'||state==='bake'){
    drawGriddle();
    if(state==='spread'){
      ctx.save();crepePath(ctx,C,C);ctx.clip();ctx.drawImage(bat,0,0,360,360);ctx.restore();
      if(tool){ctx.fillStyle='#b9824f';ctx.beginPath();ctx.arc(tool.x,tool.y,12,0,7);ctx.fill();ctx.strokeStyle='#8a5a2b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(tool.x,tool.y);ctx.lineTo(tool.x+40,tool.y-40);ctx.stroke();}
    }else drawCrepeFull(crepeColor(d),d,1,1);
  }else if(state==='top'||state==='roll'||state==='serve'||state==='result'){
    drawPlate();
    const col=crepeColor(bakeD||d);
    if(fin)drawCone(col);
    else{
      const sx=1-0.7*rp,sy=1+0.12*rp;
      drawCrepeFull(col,bakeD||d,sx,sy);drawTops(sx,sy);
      if(state==='roll'&&rp<0.05){ctx.fillStyle='rgba(91,58,41,.55)';ctx.font='900 40px sans-serif';ctx.textAlign='center';ctx.fillText('👉 ➜',C,C+150);}
    }
  }
}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==='spread'||state==='bake'||state==='top'||state==='roll'){
    patience-=dt/patDur;
    const pi=$('patI');pi.style.width=Math.max(0,patience*100)+'%';pi.style.backgroundSize=(100/Math.max(0.05,patience))+'% 100%';
    if(patience<=0){patience=0;customerLeft();}
  }
  if(state==='bake'){
    d+=dt*[0.2,0.22,0.25,0.27,0.3][Math.min(G.i,4)];
    $('mk').style.left=Math.min(100,d/1.2*100)+'%';
    $('mzone').style.left=(0.6/1.2*100)+'%';$('mzone').style.width=(0.2/1.2*100)+'%';
    if(d>=1.2){d=1.2;takeOut();}
  }
  render();
}
fit();$('bestT').textContent=best?'ベスト '+best+' 点':'';
meterMode(null);requestAnimationFrame(loop);
window.__crepe={get state(){return state;},get order(){return order;},get G(){return G;},get d(){return d;},get cover(){return cover;}};
})();
</script>
